databases:
  # "free" for now while testing — switch to at least "starter" before the
  # live event, since a dropped free-tier DB after inactivity would take the
  # whole site down with it. See README "Going live" section.
  - name: xacrebook-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: xacrebook
    runtime: node
    # "free" for now while testing — spins down after 15 min idle and drops
    # live Socket.IO connections. Switch to "starter" (or higher) before the
    # live event. See README "Going live" section.
    plan: free
    region: singapore
    # --include=dev is required here: this build runs with NODE_ENV=production
    # set (see envVars below), and npm treats that as an implicit
    # `--production` flag, skipping devDependencies. But vite, typescript,
    # @vitejs/plugin-react, prisma, etc. are all devDependencies needed only
    # to build — without this flag the build fails looking for them.
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npm run build
    startCommand: cd server && npm run prisma:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xacrebook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
