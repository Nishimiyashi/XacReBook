databases:
  - name: xacrebook-db
    plan: starter
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: xacrebook
    runtime: node
    plan: starter
    region: singapore
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: cd server && npm run prisma:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xacrebook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
